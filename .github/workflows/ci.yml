name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Puerta de calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # migration/evidenceValidation.test.ts reconstruye la evidencia del
          # baseline y del tag anotado; los PR necesitan el historial completo
          # para que el gate no dependa de cómo se disparó el workflow.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `check` encadena lint, typecheck, pruebas y build. Se ejecuta como un
      # solo paso a propósito: si la compilación falla, el lint que pasó antes
      # no significa que la rama esté sana, y partirlo invita a leerlo así.
      - name: lint · typecheck · test · build
        run: npm run check
